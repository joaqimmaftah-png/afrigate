name: Staging smoke
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Immutable AfriGate Preview for the selected branch and commit'
        required: true
        type: string
  deployment_status:
permissions:
  contents: read
jobs:
  staging:
    if: >-
      github.repository == 'joaqimmaftah-png/afrigate' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'Preview' &&
        github.event.deployment.production_environment == false &&
        github.event.deployment.creator.login == 'vercel[bot]' &&
        github.event.deployment_status.creator.login == 'vercel[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Signed-in checks are required by the Vercel Preview build. This job
      # verifies its revision-specific result and probes the deployed routes
      # without ever receiving credentials or creating accounts in GitHub.
      - name: Verify the staging build result and deployed Preview
        run: node scripts/check-staging-preview.mjs
        env:
          STAGING_PREVIEW_URL: ${{ inputs.preview_url || github.event.deployment_status.environment_url }}
          STAGING_PREVIEW_SHA: ${{ github.event.deployment.sha || github.sha }}
